apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alzcare-frontend-alerts
  namespace: monitoring
  labels:
    app: alzcare-frontend
    release: kube-prometheus-stack
spec:
  groups:
    - name: frontend
      rules:
        - alert: FrontendDown
          expr: nginx_up{job="alzcare-frontend"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Frontend is down"
            description: "Frontend nginx exporter is not responding."

        - alert: FrontendHighConnectionSaturation
          expr: |
            (nginx_connections_active{job="alzcare-frontend"} / nginx_connections_handled{job="alzcare-frontend"}) > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Frontend high connection saturation"
            description: "Frontend active connections are above 80% of handled connections."

        - alert: FrontendNoRequests
          expr: |
            rate(nginx_http_requests_total{job="alzcare-frontend"}[5m]) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Frontend has no traffic"
            description: "Frontend has received zero requests in the last 10 minutes."
