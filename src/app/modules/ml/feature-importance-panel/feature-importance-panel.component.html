<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h3 class="text-lg font-bold text-gray-900">🔍 Importance des Features</h3>
    <div class="flex bg-gray-100 rounded-lg p-1">
      <button
        (click)="setModel('random_forest')"
        [class.bg-white.shadow]="model === 'random_forest'"
        class="px-4 py-1.5 text-sm font-medium rounded-md transition"
      >Random Forest</button>
      <button
        (click)="setModel('gradient_boosting')"
        [class.bg-white.shadow]="model === 'gradient_boosting'"
        class="px-4 py-1.5 text-sm font-medium rounded-md transition"
      >Gradient Boosting</button>
    </div>
  </div>

  <div *ngIf="loading" class="text-center py-12 text-gray-400">Chargement...</div>

  <div *ngIf="!loading" class="grid grid-cols-1 xl:grid-cols-2 gap-6">
    <!-- Bar Chart -->
    <div class="bg-white rounded-xl shadow-md p-6">
      <h4 class="text-sm font-semibold text-gray-500 uppercase mb-4">Top 15 Features</h4>
      <div class="h-96">
        <canvas baseChart [type]="'bar'" [data]="barData" [options]="barOptions"></canvas>
      </div>
    </div>

    <!-- Liste détaillée -->
    <div class="bg-white rounded-xl shadow-md p-6">
      <h4 class="text-sm font-semibold text-gray-500 uppercase mb-4">Détail par Feature</h4>
      <div class="space-y-3 max-h-96 overflow-y-auto pr-2 custom-scrollbar">
        <div *ngFor="let f of featureImportance?.features; let i = index" class="flex items-center gap-3 p-3 bg-gray-50 rounded-lg">
          <span class="flex-shrink-0 w-6 h-6 flex items-center justify-center rounded-full text-xs font-bold text-white" [class.bg-primary-500]="i < 5" [class.bg-blue-400]="i >= 5 && i < 10" [class.bg-gray-400]="i >= 10">
            {{ i + 1 }}
          </span>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-gray-800 truncate">{{ f.feature }}</p>
            <div class="w-full bg-gray-200 rounded-full h-1.5 mt-1">
              <div class="bg-primary-500 h-1.5 rounded-full transition-all" [style.width.%]="(f.importance / (featureImportance?.features?.[0]?.importance || 1)) * 100"></div>
            </div>
          </div>
          <span class="text-xs font-semibold text-gray-500">{{ f.importance | number:'1.4-4' }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
