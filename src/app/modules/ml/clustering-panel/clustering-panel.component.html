<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h3 class="text-lg font-bold text-gray-900">📊 Analyse de Clustering</h3>
    <div class="flex bg-gray-100 rounded-lg p-1">
      <button
        (click)="setAlgorithm('kmeans')"
        [class.bg-white.shadow]="algorithm === 'kmeans'"
        class="px-4 py-1.5 text-sm font-medium rounded-md transition"
      >K-Means</button>
      <button
        (click)="setAlgorithm('gmm')"
        [class.bg-white.shadow]="algorithm === 'gmm'"
        class="px-4 py-1.5 text-sm font-medium rounded-md transition"
      >GMM</button>
    </div>
  </div>

  <div *ngIf="loading" class="text-center py-12 text-gray-400">Chargement...</div>

  <div *ngIf="!loading" class="grid grid-cols-1 xl:grid-cols-3 gap-6">
    <!-- Scatter Plot -->
    <div class="xl:col-span-2 bg-white rounded-xl shadow-md p-6">
      <h4 class="text-sm font-semibold text-gray-500 uppercase mb-4">Projection PCA 2D</h4>
      <div class="h-80">
        <canvas *ngIf="scatterData.datasets.length" baseChart [type]="'scatter'" [data]="scatterData" [options]="scatterOptions"></canvas>
      </div>
    </div>

    <!-- Doughnut + Stats -->
    <div class="space-y-6">
      <div class="bg-white rounded-xl shadow-md p-6">
        <h4 class="text-sm font-semibold text-gray-500 uppercase mb-4">Répartition</h4>
        <div class="h-56">
          <canvas *ngIf="doughnutData.datasets.length" baseChart [type]="'doughnut'" [data]="doughnutData" [options]="doughnutOptions"></canvas>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-md p-6">
        <h4 class="text-sm font-semibold text-gray-500 uppercase mb-4">Statistiques par Cluster</h4>
        <div class="space-y-3">
          <div *ngFor="let c of clusterAnalysis?.clusters" class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
            <div>
              <p class="text-sm font-semibold text-gray-800">Cluster {{ c.clusterId }}</p>
              <p class="text-xs text-gray-500">{{ c.count }} patients ({{ c.percentage }}%)</p>
            </div>
            <div class="text-right text-xs text-gray-500">
              <p>Âge moy: {{ c.avgAge }}</p>
              <p>MMSE moy: {{ c.avgMMSE }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
