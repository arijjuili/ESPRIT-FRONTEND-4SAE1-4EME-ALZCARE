<div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 p-6">
  <div class="max-w-7xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">🤖 Intelligence Artificielle</h1>
        <p class="text-sm text-gray-500 mt-1">Prédictions de risque, profils patients et recommandations personnalisées</p>
      </div>
      <div class="flex items-center gap-2 px-3 py-1.5 bg-white rounded-lg shadow-sm text-xs text-gray-500">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
        Mode démonstration actif
      </div>
    </div>

    <!-- Tabs -->
    <div class="bg-white rounded-xl shadow-sm p-1.5 flex gap-1 overflow-x-auto">
      <button
        *ngFor="let tab of tabs"
        (click)="setTab(tab.key)"
        [class.bg-primary-50]="activeTab === tab.key"
        [class.text-primary-700]="activeTab === tab.key"
        [class.border-primary-200]="activeTab === tab.key"
        [class.border-transparent]="activeTab !== tab.key"
        [class.text-gray-600]="activeTab !== tab.key"
        class="flex items-center gap-2 px-5 py-2.5 rounded-lg text-sm font-medium border transition whitespace-nowrap hover:bg-gray-50"
      >
        <span>{{ tab.icon }}</span>
        {{ tab.label }}
      </button>
    </div>

    <!-- Content -->
    <div class="transition-opacity duration-300">
      <app-risk-prediction-panel *ngIf="activeTab === 'prediction'"></app-risk-prediction-panel>
      <app-clustering-panel *ngIf="activeTab === 'profiles'"></app-clustering-panel>
      <app-recommendation-panel *ngIf="activeTab === 'recommendations'"></app-recommendation-panel>
    </div>
  </div>
</div>
