<div *ngIf="visible" 
     class="fixed inset-0 z-50 flex items-center justify-center p-4"
     style="background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);">
  
  <div class="relative overflow-hidden w-full max-w-lg rounded-3xl shadow-2xl"
       [style.background]="'linear-gradient(135deg, ' + primaryColor + '20 0%, ' + secondaryColor + '20 100%)'"
       style="border: 2px solid rgba(255,255,255,0.3);">
    
    <div class="absolute inset-0 overflow-hidden">
      <div class="absolute top-1/4 left-1/4 w-40 h-40 rounded-full" 
           [style.background]="'radial-gradient(circle, ' + primaryColor + '40 0%, transparent 70%)'" 
           style="animation: orbs 4s ease-in-out infinite;"></div>
      <div class="absolute bottom-1/4 right-1/4 w-48 h-48 rounded-full" 
           [style.background]="'radial-gradient(circle, ' + secondaryColor + '40 0%, transparent 70%)'" 
           style="animation: orbs 5s ease-in-out infinite reverse;"></div>
      <div class="absolute top-1/2 left-1/2 w-32 h-32 rounded-full bg-white/10" 
           style="animation: pulse 3s ease-in-out infinite;"></div>
    </div>

    <div class="absolute inset-0 bg-gradient-to-b from-white/20 to-transparent"></div>

    <div class="relative z-10 text-center py-14 px-8">
      <div class="mb-8">
        <div class="inline-flex items-center justify-center w-28 h-28 bg-white/30 backdrop-blur-md rounded-3xl mb-5 shadow-lg"
             style="animation: float 3s ease-in-out infinite; box-shadow: 0 10px 40px rgba(0,0,0,0.2);">
          <span class="text-6xl filter drop-shadow-lg">{{ gameIcon }}</span>
        </div>
      </div>
      
      <h1 class="text-5xl md:text-6xl font-black text-white mb-3 tracking-tight"
          style="text-shadow: 0 4px 20px rgba(0,0,0,0.3);">
        {{ gameName }}
      </h1>
      
      <p class="text-white/80 text-lg font-medium mb-8">Ready to play?</p>
      
      <div class="flex items-center justify-center gap-1.5 mb-8">
        <div class="w-3 h-3 bg-white rounded-full" style="animation: bounce 0.6s ease-in-out infinite;"></div>
        <div class="w-3 h-3 bg-white rounded-full" style="animation: bounce 0.6s ease-in-out 0.15s infinite;"></div>
        <div class="w-3 h-3 bg-white rounded-full" style="animation: bounce 0.6s ease-in-out 0.3s infinite;"></div>
      </div>

      <button (click)="skipSplash()"
              class="px-8 py-3.5 bg-white/25 hover:bg-white/40 backdrop-blur-sm text-white font-bold rounded-2xl transition-all duration-300 hover:scale-105 hover:shadow-lg border border-white/20">
        Let's Go! 🚀
      </button>
    </div>

    <div class="absolute bottom-0 left-0 right-0 overflow-hidden rounded-b-3xl">
      <div class="h-1.5 bg-white/30">
        <div class="h-full bg-white rounded-full animate-loading shadow-glow"></div>
      </div>
    </div>
  </div>
</div>

<style>
@keyframes orbs {
  0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
  50% { transform: translate(20px, -20px) scale(1.1); opacity: 0.8; }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
  50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.3; }
}

@keyframes animate-loading {
  0% { width: 0%; }
  100% { width: 100%; }
}

.animate-loading {
  animation: animate-loading 3s linear forwards;
}

.shadow-glow {
  box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
}
</style>
