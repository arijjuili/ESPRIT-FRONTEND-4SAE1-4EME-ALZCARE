<div *ngIf="visible" 
     class="absolute inset-0 z-50 flex items-center justify-center"
     style="background: rgba(0, 0, 0, 0.6);">
  
  <div class="relative overflow-hidden w-full max-w-lg mx-4 rounded-3xl shadow-2xl"
       [style.background]="'linear-gradient(135deg, ' + primaryColor + ' 0%, ' + secondaryColor + ' 100%)'">
    
    <div class="absolute inset-0 overflow-hidden">
      <div class="absolute top-1/4 left-1/4 w-32 h-32 bg-white/10 rounded-full blur-3xl animate-pulse"></div>
      <div class="absolute bottom-1/4 right-1/4 w-48 h-48 bg-white/10 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
    </div>

    <div class="relative z-10 text-center py-12 px-8">
      <div class="mb-6">
        <div class="inline-flex items-center justify-center w-24 h-24 bg-white/20 backdrop-blur-sm rounded-3xl mb-4 animate-bounce">
          <span class="text-5xl">{{ gameIcon }}</span>
        </div>
      </div>
      
      <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">
        {{ gameName }}
      </h1>
      
      <div class="flex items-center justify-center gap-2 mb-6">
        <div class="w-3 h-3 bg-white rounded-full animate-bounce" style="animation-delay: 0s;"></div>
        <div class="w-3 h-3 bg-white rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
        <div class="w-3 h-3 bg-white rounded-full animate-bounce" style="animation-delay: 0.4s;"></div>
      </div>

      <button (click)="skipSplash()"
              class="px-6 py-2.5 bg-white/20 hover:bg-white/30 backdrop-blur-sm text-white font-semibold rounded-xl transition-all duration-300 hover:scale-105">
        Skip →
      </button>
    </div>

    <div class="absolute bottom-0 left-0 right-0">
      <div class="h-1 bg-white/20">
        <div class="h-full bg-white rounded-full animate-loading"></div>
      </div>
    </div>
  </div>
</div>

<style>
@keyframes animate-loading {
  0% { width: 0%; }
  100% { width: 100%; }
}
.animate-loading {
  animation: animate-loading 3s linear forwards;
}
</style>
