<div class="notification-bell-container">
  <!-- Bell Button with Badge -->
  <button 
    class="bell-button"
    (click)="toggleDropdown()"
    [attr.aria-label]="'Notifications' + (unreadCount > 0 ? ' (' + unreadCount + ' unread)' : '')"
    [attr.aria-expanded]="isDropdownOpen"
    [style.--theme-primary]="effectiveTheme.primary"
    [style.--theme-primary-light]="effectiveTheme.primaryLight"
    [style.--theme-primary-dark]="effectiveTheme.primaryDark"
    [style.--theme-hover-bg]="effectiveTheme.hoverBg">
    
    <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
    
    <!-- Unread Badge -->
    <span 
      *ngIf="unreadCount > 0"
      class="unread-badge"
      [class.critical]="criticalCount > 0"
      [style.--theme-primary]="effectiveTheme.primary">
      {{ unreadCount > 99 ? '99+' : unreadCount }}
    </span>
  </button>

  <!-- Dropdown Panel -->
  <div 
    class="dropdown-panel"
    [class.open]="isDropdownOpen"
    [style.--theme-primary]="effectiveTheme.primary"
    [style.--theme-primary-light]="effectiveTheme.primaryLight"
    [style.--theme-primary-dark]="effectiveTheme.primaryDark"
    [style.--theme-border-color]="effectiveTheme.borderColor"
    [style.--theme-hover-bg]="effectiveTheme.hoverBg">
    
    <!-- Header -->
    <div class="dropdown-header">
      <h3 class="header-title">Notifications</h3>
      <span 
        *ngIf="unreadCount > 0" 
        class="unread-indicator"
        [style.background-color]="effectiveTheme.primaryLight"
        [style.color]="effectiveTheme.primaryDark">
        {{ unreadCount }} new
      </span>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="loading-state">
      <div class="loading-spinner" [style.--theme-primary]="effectiveTheme.primary"></div>
      <span>Loading...</span>
    </div>

    <!-- Empty State -->
    <div *ngIf="!isLoading && notifications.length === 0" class="empty-state">
      <span class="empty-icon">🔔</span>
      <p>No notifications yet</p>
      <span class="empty-subtitle">You're all caught up!</span>
    </div>

    <!-- Notification List -->
    <div *ngIf="!isLoading && notifications.length > 0" class="notification-list">
      <div 
        *ngFor="let notification of notifications"
        class="notification-item"
        [class.unread]="notification.status === 'DELIVERED'"
        [class.clickable]="notification.actionUrl"
        [class.critical]="notification.priority === 'CRITICAL'"
        (click)="onNotificationClick(notification)"
        [style.--theme-primary-light]="effectiveTheme.primaryLight"
        [style.--theme-hover-bg]="effectiveTheme.hoverBg">
        
        <!-- Icon -->
        <div 
          class="notification-icon"
          [class]="getNotificationBgClass(notification.priority)">
          <span>{{ getNotificationIcon(notification.type) }}</span>
        </div>
        
        <!-- Content -->
        <div class="notification-content">
          <div class="notification-header">
            <h4 class="notification-title" [title]="notification.title">
              {{ notification.title }}
            </h4>
            <span 
              *ngIf="notification.status === 'DELIVERED'" 
              class="unread-dot"
              [style.background-color]="effectiveTheme.primary">
            </span>
          </div>
          <p class="notification-message" [title]="notification.message">
            {{ notification.message }}
          </p>
          <div class="notification-footer">
            <span class="timestamp">{{ formatTimestamp(notification.createdAt) }}</span>
            <span 
              *ngIf="notification.priority === 'CRITICAL' || notification.priority === 'HIGH'"
              class="priority-badge"
              [class]="getNotificationColorClass(notification.priority)">
              {{ notification.priority }}
            </span>
          </div>
        </div>

        <!-- Mark as Read Button (visible on hover for unread items) -->
        <button 
          *ngIf="notification.status === 'DELIVERED'"
          class="mark-read-btn"
          (click)="markAsRead(notification.id, $event)"
          title="Mark as read"
          [style.--theme-primary]="effectiveTheme.primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="dropdown-footer">
      <button 
        class="view-all-btn"
        (click)="viewAllNotifications()"
        [style.--theme-primary]="effectiveTheme.primary"
        [style.--theme-primary-light]="effectiveTheme.primaryLight"
        [style.--theme-hover-bg]="effectiveTheme.hoverBg">
        <span>View All Notifications</span>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </div>
</div>
