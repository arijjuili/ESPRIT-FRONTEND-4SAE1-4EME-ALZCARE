<div *ngIf="visible" class="fixed inset-0 z-40">
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity duration-300"
       [class.opacity-100]="showHighlight"
       [class.opacity-0]="!showHighlight"
       (click)="closeGuidelines()">
  </div>

  <div class="absolute inset-0 pointer-events-none">
    <div *ngIf="highlightSelector" 
         class="absolute rounded-2xl shadow-2xl transition-all duration-500"
         [class.scale-100]="showHighlight"
         [class.scale-95]="!showHighlight"
         [style.box-shadow]="'0 0 0 9999px rgba(0, 0, 0, 0.6), 0 0 30px ' + primaryColor + '40'"
         [style.top.%]="20"
         [style.left.%]="20"
         [style.width.%]="60"
         [style.height.%]="60">
    </div>
  </div>

  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 w-full max-w-lg px-4">
    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden transform transition-all duration-300"
         [class.opacity-100]="showHighlight"
         [class.opacity-0]="!showHighlight"
         [class.scale-100]="showHighlight"
         [class.scale-95]="!showHighlight">
      <div class="p-6" [style.background]="'linear-gradient(135deg, ' + primaryColor + ' 0%, ' + primaryColor + 'cc 100%)'">
        <div class="flex items-center justify-between">
          <h2 class="text-2xl font-bold text-white">{{ title }}</h2>
          <button (click)="closeGuidelines()"
                  class="w-10 h-10 bg-white/20 hover:bg-white/30 rounded-full flex items-center justify-center text-white text-xl transition-all duration-200 hover:rotate-90">
            ✕
          </button>
        </div>
      </div>

      <div class="p-6">
        <div class="space-y-4">
          <div *ngFor="let step of steps; let i = index" 
               class="flex items-start gap-4 p-4 bg-gray-50 rounded-2xl hover:bg-gray-100 transition-colors">
            <div class="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-white font-bold"
                 [style.backgroundColor]="primaryColor">
              {{ i + 1 }}
            </div>
            <div class="flex-1">
              <p class="font-semibold text-gray-900">{{ step.title }}</p>
              <p class="text-sm text-gray-600 mt-1">{{ step.description }}</p>
            </div>
            <span *ngIf="step.icon" class="text-2xl">{{ step.icon }}</span>
          </div>
        </div>

        <button (click)="closeGuidelines()"
                class="mt-6 w-full py-3 text-white font-semibold rounded-2xl transition-all duration-200 hover:opacity-90 hover:scale-[1.02]"
                [style.backgroundColor]="primaryColor">
          Got it! Let's Play
        </button>
      </div>
    </div>
  </div>
</div>
