apiVersion: apps/v1
kind: Deployment
metadata:
  name: alzcare-frontend
  namespace: alzcare
  labels:
    app: alzcare-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alzcare-frontend
  template:
    metadata:
      labels:
        app: alzcare-frontend
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: alzcare-frontend
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: "500m"
            memory: "256M"
          requests:
            cpu: "100m"
            memory: "128M"
        startupProbe:
          httpGet:
            path: /health
            port: 80
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          periodSeconds: 20
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:1.1.0
        args:
          - --nginx.scrape-uri=http://localhost:80/nginx_status
        ports:
        - containerPort: 9113
          name: metrics
        resources:
          limits:
            cpu: "100m"
            memory: "64M"
          requests:
            cpu: "50m"
            memory: "32M"
---
apiVersion: v1
kind: Service
metadata:
  name: alzcare-frontend
  namespace: alzcare
  labels:
    app: alzcare-frontend
spec:
  selector:
    app: alzcare-frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
  - port: 9113
    targetPort: 9113
    name: metrics
---
# NodePort service to access the frontend from outside the cluster
apiVersion: v1
kind: Service
metadata:
  name: alzcare-frontend-nodeport
  namespace: alzcare
  labels:
    app: alzcare-frontend
spec:
  type: NodePort
  selector:
    app: alzcare-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    name: http
