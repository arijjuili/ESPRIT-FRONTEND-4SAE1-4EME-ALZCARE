sonar.organization=salma-louhichi
sonar.projectKey=salma-louhichi_alzcare-frontend
sonar.sources=src
sonar.typescript.tsconfigPath=tsconfig.json
sonar.sourceEncoding=UTF-8

# Coverage report generated by Karma
sonar.javascript.lcov.reportPaths=coverage/alzheimer-care-app/lcov.info

# Exclude tests, config, and generated files from analysis
sonar.exclusions=**/.git/**,**/node_modules/**,**/dist/**,**/*.spec.ts,**/karma.conf.js

# Exclude test files and config from coverage metrics
sonar.coverage.exclusions=**/*.spec.ts,**/karma.conf.js,**/environments/**,**/*.module.ts
